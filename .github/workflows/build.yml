name: Build OpenSSL SDK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['.github/workflows/build.yml', 'LICENSE', 'config/**', 'scripts/**']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/build.yml', 'LICENSE', 'config/**', 'scripts/**', 'tests/**']

permissions:
  contents: read

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: python3 scripts/generate-github-matrix.py --github-output "$GITHUB_OUTPUT"

  build-sdk:
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned OpenSSL source
        shell: bash
        run: scripts/fetch-and-verify-source.sh "$RUNNER_TEMP/openssl"
      - name: Build macOS SDK
        if: matrix.os == 'macos'
        env:
          SDK_ARCH: ${{ matrix.arch }}
          SDK_MINIMUM_SYSTEM_VERSION: ${{ matrix.minimumSystemVersion }}
          OPENSSL_SRC: ${{ runner.temp }}/openssl
          OPENSSL_PREFIX: ${{ runner.temp }}/openssl-prefix
        run: scripts/build-macos.sh
      - name: Build Windows SDK
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          SDK_ARCH: ${{ matrix.arch }}
          OPENSSL_SRC: ${{ runner.temp }}/openssl
          OPENSSL_PREFIX: ${{ runner.temp }}/openssl-prefix
        run: ./scripts/build-windows.ps1
      - name: Stage and verify SDK
        shell: bash
        env:
          SDK_MINIMUM_SYSTEM_VERSION: ${{ matrix.minimumSystemVersion }}
        run: |
          scripts/stage-sdk.sh --install "$RUNNER_TEMP/openssl-prefix" --output "$RUNNER_TEMP/sdk" --platform '${{ matrix.os }}' --arch '${{ matrix.arch }}'
          python3 scripts/validate-sdk-layout.py "$RUNNER_TEMP/sdk" --platform '${{ matrix.os }}' --arch '${{ matrix.arch }}'
          python3 scripts/verify-sdk-binary.py "$RUNNER_TEMP/sdk" --platform '${{ matrix.os }}' --arch '${{ matrix.arch }}'
      - name: Smoke-test Windows libcrypto
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          OPENSSL_SDK_BIN: ${{ runner.temp }}/sdk/bin
        run: |
          @'
          import ctypes
          import os
          from pathlib import Path

          runtime_dir = Path(os.environ["OPENSSL_SDK_BIN"])
          runtime = next(runtime_dir.glob("libcrypto-*.dll"))
          os.add_dll_directory(str(runtime_dir))
          library = ctypes.WinDLL(str(runtime))
          library.RAND_bytes.argtypes = (ctypes.POINTER(ctypes.c_ubyte), ctypes.c_int)
          library.RAND_bytes.restype = ctypes.c_int
          buffer = (ctypes.c_ubyte * 1)()
          if library.RAND_bytes(buffer, len(buffer)) != 1:
              raise SystemExit("RAND_bytes failed")
          '@ | python -
      - uses: actions/upload-artifact@v4
        with:
          name: openssl-sdk-${{ matrix.key }}
          path: ${{ runner.temp }}/sdk

  publish-release:
    needs: build-sdk
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          sdk_version="$(python3 -c 'import json; print(json.load(open("config/sdk-version.json"))["sdkVersion"])')"
          expected_tag="v${sdk_version}"
          if [[ "${EVENT_NAME}" == "push" ]]; then
            release_tag="${REF_NAME}"
            [[ "${release_tag}" == "${expected_tag}" ]] || {
              echo "release tag must match sdkVersion: expected ${expected_tag}, got ${release_tag}" >&2
              exit 1
            }
          else
            release_tag="${expected_tag}"
          fi
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"
      - name: Archive SDKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for directory in dist/*; do
            name="$(basename "$directory")"
            (cd dist && zip -qr "../release/${name}.zip" "$name")
            sha256sum "release/${name}.zip" > "release/${name}.zip.sha256"
          done
      - name: Generate artifact index
        shell: bash
        run: |
          python3 scripts/generate-artifact-index.py --release-assets release --output release/artifact-index.json \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.release.outputs.tag }}" \
            --release-tag "${{ steps.release.outputs.tag }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            release/*.zip
            release/*.zip.sha256
            release/artifact-index.json
